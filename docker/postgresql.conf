# PostgreSQL configuration for CDC with Debezium
# This configuration enables logical replication needed for Change Data Capture

# WAL (Write-Ahead Logging) settings for CDC
wal_level = logical
max_wal_senders = 4
max_replication_slots = 4

# Connection settings
listen_addresses = '*'
max_connections = 100

# Logging
log_timezone = 'UTC'
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_statement = 'mod'  # Log all data-modifying statements
log_replication_commands = on

# Performance tuning (adjust based on your needs)
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 16MB
maintenance_work_mem = 64MB

# Checkpoint settings
checkpoint_timeout = 10min
max_wal_size = 1GB
min_wal_size = 80MB
